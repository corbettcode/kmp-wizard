# DigitalOcean App Platform spec. Create the app with:
#   doctl apps create --spec .do/app.yaml
# and apply later changes with:
#   doctl apps update <app-id> --spec .do/app.yaml
name: kmp-wizard
region: nyc
services:
  - name: web
    github:
      repo: corbettcode/kmp-wizard
      branch: master
      deploy_on_push: true
    dockerfile_path: Dockerfile
    # Kobweb serves the site and /api on the port in site/.kobweb/conf.yaml.
    http_port: 8080
    # 512 MB is enough: idle ~140 MB, ~370 MB peak under 20 concurrent generate requests.
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # An API route, not a static page: it only answers once the server-side API jar is loaded.
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
